[workspace]
resolver = "2"
members = [
  "engine",
  "bindings/node",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "2"
napi-build = "2"
