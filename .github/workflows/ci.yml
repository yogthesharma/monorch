name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Test
        run: cargo test -p monorch-engine

  node:
    name: Build + typecheck + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            bindings/node -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Test @monorch/ai
        run: pnpm test:ai
      - name: Performance baselines
        run: pnpm bench:check
      - name: Smoke
        run: pnpm smoke

  npm-consumers:
    name: Published npm consumer smokes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: smoke:npm
        run: npm --prefix examples/npm-smoke install && npm --prefix examples/npm-smoke run smoke
      - name: smoke:hono
        run: npm --prefix examples/hono-npm install && npm --prefix examples/hono-npm run smoke

  npm-install-matrix:
    name: npm install smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install published @monorch/ai + load native
        shell: bash
        run: node scripts/npm-install-smoke.mjs

  live-smoke:
    name: Live provider smoke
    runs-on: ubuntu-latest
    # Only on main pushes — needs repo secret; skip quietly when unset.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            bindings/node -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Live smoke (optional)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_URL: ${{ secrets.LITELLM_URL }}
          LIVE_MODEL: ${{ vars.LIVE_MODEL }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ] && [ -z "${LITELLM_API_KEY:-}" ]; then
            echo "No OPENAI_API_KEY / LITELLM_API_KEY secret — skipping live smoke"
            exit 0
          fi
          LIVE_SMOKE=1 pnpm smoke:live

  alpine-musl:
    name: Alpine musl native smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            bindings/node -> target
          key: musl-x64
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Build linux musl natives
        working-directory: bindings/node
        run: |
          pnpm exec napi build --platform --release --target x86_64-unknown-linux-musl --zig
          pnpm exec napi build --platform --release --target aarch64-unknown-linux-musl --zig
      - name: Build @monorch/ai
        run: pnpm --filter @monorch/ai build
      - name: Smoke on Alpine (node:22-alpine)
        run: docker run --rm -v "$PWD:/work" -w /work node:22-alpine node scripts/alpine-musl-smoke.mjs

  postgres:
    name: Postgres integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: monorch
          POSTGRES_PASSWORD: monorch
          POSTGRES_DB: monorch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monorch -d monorch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://monorch:monorch@localhost:5432/monorch_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            bindings/node -> target
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Test @monorch/ai/postgres
        run: pnpm test:postgres
