name: Release

# Publishes @monorch/runtime (+ per-platform optional packages) and @monorch/ai.
# Secrets: NPM_TOKEN (Automation token with publish rights on @monorch)
#
# Publish gates (do not loosen):
#   - Tag push v* → publish with npm --provenance
#   - workflow_dispatch + dry_run=false → publish
#   - workflow_dispatch + dry_run=true (default) → pack only
#   - Never publishes on push to main / pull_request
#
# Recommended flow:
#   1. Ensure CI is green on main (via PR)
#   2. Bump version in package.json / Cargo.toml workspace (or pass workflow_dispatch version)
#   3. Tag v0.1.0 and push, OR run this workflow with dry_run=false
#   4. Default workflow_dispatch is dry_run=true (pack only)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (e.g. 0.1.0). Empty = keep package.json."
        required: false
        type: string
      dry_run:
        description: "Pack only — skip npm publish"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: musl
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            cross: musl
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
    name: build-${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            bindings/node -> target
          key: release-${{ matrix.settings.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install aarch64 linux cross compiler
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
      - name: Install zig (musl cross)
        if: matrix.settings.cross == 'musl'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild (musl cross)
        if: matrix.settings.cross == 'musl'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build native
        working-directory: bindings/node
        # bash so the musl EXTRA logic works on Windows runners (default is pwsh)
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ matrix.settings.cross }}" = "musl" ]; then
            EXTRA="--zig"
          fi
          pnpm exec napi build --platform --release --target ${{ matrix.settings.target }} $EXTRA
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: bindings/node/*.node
          if-no-files-found: error

  publish:
    name: Assemble + publish
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stamp version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        run: node scripts/set-version.mjs "${{ inputs.version }}"
      - name: Build @monorch/ai
        run: pnpm --filter @monorch/ai build
      - name: Assemble platform packages
        working-directory: bindings/node
        run: |
          pnpm exec napi create-npm-dir -t .
          pnpm exec napi artifacts --dir ../../artifacts
          node ../../scripts/stamp-optional-deps.mjs
          node ../../scripts/platform-utils.mjs verify
      - name: Pack
        run: |
          mkdir -p packs
          (cd bindings/node && pnpm pack --pack-destination ../../packs)
          (cd packages/ai && pnpm pack --pack-destination ../../packs)
          ls -la packs
          tar -tzf packs/monorch-runtime-*.tgz | head -40
          tar -tzf packs/monorch-ai-*.tgz | head -40
          export WANT="$(node scripts/platform-utils.mjs count)"
          node -e "const p=require('./bindings/node/package.json'); const n=Object.keys(p.optionalDependencies??{}).length; const want=Number(process.env.WANT); if(n<want){console.error('missing optionalDependencies', n, 'want', want, p.optionalDependencies); process.exit(1)}; console.log('optionalDependencies', n)"
      - name: Publish to npm
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Belt-and-suspenders for pnpm → npm publish (OIDC via id-token: write)
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is required to publish"
            exit 1
          fi
          publish_if_needed() {
            local dir="$1"
            local name version
            name="$(node -p "require('./${dir}/package.json').name")"
            version="$(node -p "require('./${dir}/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skip already published ${name}@${version}"
            else
              echo "Publishing ${name}@${version} from ${dir} (with provenance)"
              if [[ "$dir" == bindings/node/npm/* ]]; then
                (cd "$dir" && npm publish --access public --provenance)
              else
                # pnpm rewrites workspace:* for consumers; provenance via flag + NPM_CONFIG_PROVENANCE
                (cd "$dir" && pnpm publish --access public --no-git-checks --provenance)
              fi
            fi
          }
          for dir in bindings/node/npm/*; do
            if [ -d "$dir" ]; then
              publish_if_needed "$dir"
            fi
          done
          publish_if_needed bindings/node
          publish_if_needed packages/ai

      - name: Verify published packages on registry
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/ai/package.json').version")"
          WANT="$(node scripts/platform-utils.mjs count)"
          echo "Verifying @monorch/ai@${VERSION} and runtime optionalDependencies (want ${WANT})…"

          # npm can return 404 for a few seconds after a successful publish (CDN lag).
          attempt=1
          max_attempts=12
          sleep_s=5
          while true; do
            if npm view "@monorch/ai@${VERSION}" version \
              && npm view "@monorch/runtime@${VERSION}" version; then
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Registry still missing @monorch/ai@${VERSION} after ${max_attempts} attempts"
              exit 1
            fi
            echo "Registry lag (attempt ${attempt}/${max_attempts}); sleeping ${sleep_s}s…"
            sleep "$sleep_s"
            attempt=$((attempt + 1))
          done

          COUNT="$(node -e "const o=require('child_process').execSync('npm view @monorch/runtime@' + process.argv[1] + ' optionalDependencies --json',{encoding:'utf8'}); const j=JSON.parse(o); console.log(Object.keys(j||{}).length)" "$VERSION")"
          if [ "$WANT" -lt 1 ]; then
            echo "No local platform dirs under bindings/node/npm — assemble step failed?"
            exit 1
          fi
          if [ "$COUNT" -lt "$WANT" ]; then
            echo "Expected ${WANT} optionalDependencies on @monorch/runtime@${VERSION}, got ${COUNT}"
            npm view "@monorch/runtime@${VERSION}" optionalDependencies
            exit 1
          fi
          echo "OK — registry has @monorch/ai@${VERSION}, runtime optionals=${COUNT}"

      - name: Post-publish consumer smokes
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          REQUIRE_PUBLISHED: "1"
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/ai/package.json').version")"
          # Ensure examples pin matches the version we just published.
          node -e "
            const fs=require('fs');
            for (const p of ['examples/npm-smoke/package.json','examples/hono-npm/package.json']) {
              const j=JSON.parse(fs.readFileSync(p,'utf8'));
              if (j.dependencies['@monorch/ai'] !== process.argv[1]) {
                console.error(p, 'pins', j.dependencies['@monorch/ai'], 'want', process.argv[1]);
                process.exit(1);
              }
            }
            console.log('example pins OK @', process.argv[1]);
          " "$VERSION"
          bash scripts/consumer-smoke.sh both
          node scripts/npm-install-smoke.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: npm-packs
          path: packs/*.tgz
