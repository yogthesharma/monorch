name: Release

# Publishes @monorch/runtime (+ per-platform optional packages) and @monorch/ai.
# Secrets: NPM_TOKEN (Automation token with publish rights on @monorch)
#
# Recommended flow:
#   1. Ensure CI is green on main
#   2. Bump version in package.json / Cargo.toml workspace (or pass workflow_dispatch version)
#   3. Tag v0.1.0 and push, OR run this workflow with dry_run=false
#   4. Default workflow_dispatch is dry_run=true (pack only)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (e.g. 0.1.0). Empty = keep package.json."
        required: false
        type: string
      dry_run:
        description: "Pack only — skip npm publish"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-13
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
    name: build-${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            bindings/node -> target
          key: release-${{ matrix.settings.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install aarch64 linux cross compiler
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
      - name: Build native
        working-directory: bindings/node
        run: pnpm exec napi build --platform --release --target ${{ matrix.settings.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: bindings/node/*.node
          if-no-files-found: error

  publish:
    name: Assemble + publish
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stamp version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        run: node scripts/set-version.mjs "${{ inputs.version }}"
      - name: Build @monorch/ai
        run: pnpm --filter @monorch/ai build
      - name: Assemble platform packages
        working-directory: bindings/node
        run: |
          pnpm exec napi create-npm-dir -t .
          pnpm exec napi artifacts --dir ../../artifacts
          node ../../scripts/stamp-optional-deps.mjs
      - name: Pack
        run: |
          mkdir -p packs
          (cd bindings/node && pnpm pack --pack-destination ../../packs)
          (cd packages/ai && pnpm pack --pack-destination ../../packs)
          ls -la packs
          tar -tzf packs/monorch-runtime-*.tgz | head -40
          tar -tzf packs/monorch-ai-*.tgz | head -40
          node -e "const p=require('./bindings/node/package.json'); if(!p.optionalDependencies||Object.keys(p.optionalDependencies).length<6){console.error('missing optionalDependencies', p.optionalDependencies); process.exit(1)}; console.log('optionalDependencies', p.optionalDependencies)"
      - name: Publish to npm
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is required to publish"
            exit 1
          fi
          for dir in bindings/node/npm/*; do
            if [ -d "$dir" ]; then
              echo "Publishing platform package $dir"
              (cd "$dir" && npm publish --access public)
            fi
          done
          (cd bindings/node && pnpm publish --access public --no-git-checks)
          (cd packages/ai && pnpm publish --access public --no-git-checks)
      - uses: actions/upload-artifact@v4
        with:
          name: npm-packs
          path: packs/*.tgz
