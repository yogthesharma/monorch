name: Documentation
description: Typo, missing docs, or incorrect examples on the site / README.
title: "[docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: location
    attributes:
      label: Where?
      description: URL or file path (e.g. https://monorch.vercel.app/docs/agents or packages/ai/README.md)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What’s wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix (optional)
